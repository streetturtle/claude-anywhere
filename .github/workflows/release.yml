name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build binaries
        run: |
          # Build for macOS (Intel)
          GOOS=darwin GOARCH=amd64 go build -o claude-anywhere-darwin-amd64 ./cmd/claude-anywhere
          
          # Build for macOS (Apple Silicon)
          GOOS=darwin GOARCH=arm64 go build -o claude-anywhere-darwin-arm64 ./cmd/claude-anywhere

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            claude-anywhere-darwin-amd64
            claude-anywhere-darwin-arm64
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
